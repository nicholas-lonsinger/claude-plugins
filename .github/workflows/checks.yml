name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendored copies match their canonical sources
        run: tools/sync-vendored.sh --check
      - name: Shell syntax
        run: git ls-files '*.sh' | xargs -n1 bash -n
      - name: Shellcheck (scoped to scripts with CI coverage)
        # Scoped to the files maintained against shellcheck; widen as the
        # older plugin scripts are brought up to warning-free.
        run: shellcheck github/scripts/*.sh issues/scripts/wait-for-ci.sh tools/*.sh
