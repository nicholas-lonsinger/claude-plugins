name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendored copies match their canonical sources
        run: tools/sync-vendored.sh --check
      - name: Shell syntax
        run: git ls-files '*.sh' | xargs -n1 bash -n
      - name: Shellcheck (all tracked scripts; project directives in .shellcheckrc)
        run: git ls-files '*.sh' | xargs shellcheck
      - name: JSON manifests parse
        run: git ls-files '*.json' | xargs -n1 jq empty
      - name: claude-memory-sync test harness
        run: bash claude-memory-sync/tests/memtest.sh
