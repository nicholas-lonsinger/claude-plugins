name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shell syntax
        run: git ls-files '*.sh' | xargs -n1 bash -n
      - name: Shellcheck (all tracked scripts; project directives in .shellcheckrc)
        run: git ls-files '*.sh' | xargs shellcheck
      - name: JSON manifests parse
        run: git ls-files '*.json' | xargs -n1 jq empty
      - name: Plugin test harnesses (every tracked <plugin>/tests/*.sh)
        run: |
          # Discovered, not listed: a harness that is committed but never run
          # reads as coverage that is not there. Same `git ls-files` sweep the
          # lint steps use, so a new harness executes the moment it lands.
          git ls-files '*/tests/*.sh' | while IFS= read -r harness; do
            echo "== $harness =="
            bash "$harness" || exit 1
          done
